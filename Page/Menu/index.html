<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Restaurante</title>
    <link rel="stylesheet" href="/Page/Menu/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

<body>
    <div class="container">
        <header>
            <h1>Menú</h1>
            <div class="header-actions justify-end">
                <div class="shopping" style="width: 25px;">
                    <img src="/assets/img/shopping.svg">
                    <span class="quantity">0</span>
                </div>
                <button class="btn boton logout-button" onclick="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </header>

<!-- Mantén todo igual hasta la sección del listado -->
<div class="list">
    <!-- Eliminamos el contenido dinámico y lo ponemos directamente -->
    <div class="item" data-id="1" data-price="120000" data-name="Plato 1" data-image="image/1.PNG">
        <img src="assets/img/1.PNG" alt="Plato 1">

        <div class="price">$120.000</div>
        <button class="add-to-cart">Añadir al carrito</button>
    </div>

</div>
        
        <div class="card">
            <h1>Carrito de compra</h1>

                <div class="total">0</div>

        </div>
    </div>
